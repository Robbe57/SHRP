<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>$Title$</title>
  <link rel="stylesheet" href="pokestyle.css">
</head>
<body>
<div class="dex_closed" id="dex_closed">
    <button class="open" id="opendex"> open </button>
</div>

<div class="dex_open" id="dex_open">
    <p>Who is that Pokémon??</p>
    <div id="searchbar" class="box small">
        <label for="query"></label><input type="text" id="query">
        <button id="searchbutton">search</button>
    </div>
    <div class="answer" id="answer" ></div>
    <div class="shiny" id="shiny_answer"></div>
    <button class="button" id="shiny"> see the shiny?</button>
    <button class="button" id="normal"> back to normal</button>
    <button class="close" id="closedex">close</button>
    </div>

<script src="pokescript.js"></script>
</body>
</html>
